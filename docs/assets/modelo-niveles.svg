<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="tituloNiveles descNiveles">
  <title id="tituloNiveles">Modelo de niveles de una denominación</title>
  <desc id="descNiveles">Esquema del recirculador con tres referencias: MaxLevel como tope físico, LevelRecycler como nivel actual y DepositLevel como mínimo operativo o fianza. La zona bajo la fianza genera la alerta de la fila.</desc>

  <defs>
    <linearGradient id="bgNiv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081a22"/>
      <stop offset="1" stop-color="#06141b"/>
    </linearGradient>
    <linearGradient id="relleno" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2A9D8F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#457B9D" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="trama" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5B7C99" stroke-width="2" stroke-opacity="0.45"/>
    </pattern>
    <style>
      .kicker { font: 600 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2.4px; fill: #2A9D8F; }
      .h1 { font: 600 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E6EEF2; }
      .sub { font: 400 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9DB2BE; }
      .ref { font: 600 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E6EEF2; }
      .refSub { font: 400 10.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7FA6B4; }
      .panelLabel { font: 600 10.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.6px; fill: #5B7C99; }
      .code { font: 400 11px 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace; fill: #C6D6DF; }
      .codeMuted { font: 400 11px 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace; fill: #5B7C99; }
      .rowKey { font: 600 11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E6EEF2; }
      .rowJson { font: 400 10.5px 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace; fill: #2A9D8F; }
      .rowText { font: 400 10.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9DB2BE; }
      .cap { font: 400 10.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5B7C99; }
      .flag { font: 600 10px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.8px; fill: #5B7C99; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="url(#bgNiv)"/>

  <text class="kicker" x="48" y="54">CASHDRO · LECTURA DE PARÁMETROS</text>
  <text class="h1" x="48" y="90">Modelo de niveles</text>
  <text class="sub" x="48" y="116">Tres referencias por denominación y una única regla de alerta</text>

  <!-- Recirculador -->
  <rect x="90" y="160" width="150" height="380" rx="10" fill="#0A1C25" stroke="#1B3A46"/>

  <!-- contenido actual -->
  <rect x="99" y="330" width="132" height="210" rx="4" fill="url(#relleno)"/>
  <!-- zona bajo fianza -->
  <rect x="99" y="420" width="132" height="120" fill="url(#trama)"/>
  <text class="flag" x="106" y="500">BAJO MÍNIMO</text>

  <!-- referencias -->
  <line x1="80" y1="180" x2="250" y2="180" stroke="#457B9D" stroke-width="2"/>
  <line x1="80" y1="330" x2="250" y2="330" stroke="#2A9D8F" stroke-width="2.5"/>
  <line x1="80" y1="420" x2="250" y2="420" stroke="#5B7C99" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="80" y1="540" x2="250" y2="540" stroke="#1B3A46" stroke-width="2"/>

  <text class="ref" x="266" y="176">MaxLevel</text>
  <text class="refSub" x="266" y="193">Recuento · tope físico de la denominación</text>

  <text class="ref" x="266" y="326" style="fill:#2A9D8F">LevelRecycler</text>
  <text class="refSub" x="266" y="343">Total · nivel presente en el recirculador</text>

  <text class="ref" x="266" y="416">DepositLevel</text>
  <text class="refSub" x="266" y="433">Fianza · mínimo tolerado antes de alertar</text>

  <text class="refSub" x="266" y="544">Sin unidades disponibles</text>

  <text class="cap" x="90" y="574">Corte esquemático del recirculador.</text>
  <text class="cap" x="90" y="592">Alturas ilustrativas: no están a escala.</text>

  <!-- Panel derecho -->
  <rect x="520" y="150" width="420" height="470" rx="14" fill="#0A1C25" stroke="#1B3A46"/>

  <text class="panelLabel" x="544" y="180">REGLA DE EVALUACIÓN</text>
  <rect x="544" y="192" width="372" height="78" rx="8" fill="#06141b" stroke="#1B3A46"/>
  <text class="code" x="560" y="218">if (LevelRecycler &lt; DepositLevel)</text>
  <text class="codeMuted" x="560" y="238">    fila.ALERT = warning.png;</text>
  <text class="codeMuted" x="560" y="258">else fila.ALERT = check-icon.png;</text>

  <text class="panelLabel" x="544" y="304">MAPEO DE COLUMNAS</text>

  <text class="rowKey" x="544" y="330">Fianza</text>
  <text class="rowJson" x="628" y="330">DepositLevel</text>
  <text class="rowText" x="544" y="346">nivel mínimo configurado para la denominación</text>

  <text class="rowKey" x="544" y="380">Total</text>
  <text class="rowJson" x="628" y="380">LevelRecycler</text>
  <text class="rowText" x="544" y="396">nivel medido; es el que dispara la alerta</text>

  <text class="rowKey" x="544" y="430">Recuento</text>
  <text class="rowJson" x="628" y="430">MaxLevel</text>
  <text class="rowText" x="544" y="446">capacidad máxima; solo se muestra, no se evalúa</text>

  <text class="rowKey" x="544" y="480">Denominación</text>
  <text class="rowJson" x="664" y="480">Value</text>
  <text class="rowText" x="544" y="496">valor en centavos, dividido por 100 al mostrarse</text>

  <line x1="544" y1="522" x2="916" y2="522" stroke="#1B3A46"/>

  <text class="rowText" x="544" y="546">La comparación se hace con Convert.ToInt32 sobre</text>
  <text class="rowText" x="544" y="563">los valores del JSON: una respuesta no numérica</text>
  <text class="rowText" x="544" y="580">lanza excepción y corta la carga de la grilla.</text>
  <text class="rowText" x="544" y="604">La moneda está fijada en CLP.</text>
</svg>
